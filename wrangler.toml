name = "careradar"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Workers Logs：日誌永久保存，不必在錯誤發生當下開著即時視窗才看得到。
[observability]
enabled = true

[observability.logs]
enabled = true

# Workers AI binding - no separate API key needed, billed on your Cloudflare
# account's Workers AI Neurons (10,000/day free allocation).
[ai]
binding = "AI"

# D1 (SQLite) database for cases / history / claims.
# Create with: wrangler d1 create disaster-care-radar-db
# then paste the returned database_id below.
[[d1_databases]]
binding = "DB"
database_name = "disaster-care-radar-db"
database_id = "83feebfb-668f-48c3-9e1c-cd71df0c62c1"

# Secrets (set with `wrangler secret put <NAME>`, never commit these):
#   LINE_CHANNEL_SECRET
#   LINE_CHANNEL_ACCESS_TOKEN

# 非機密的環境變數。跟上面那幾個憑證是不同類別 —— 這裡的值不敏感，
# 寫進版控反而是優點：Dashboard 上手動設的變數沒有任何一份紀錄留在 repo 裡，
# 重新部署時會被當成未定義而清空（已經連續發生兩次）。
[vars]
# 測試用的「重置我的測試案件」暗號開關。預設 "false"：正式部署一律關閉，
# 要測試時再去 Dashboard 的 Variables and Secrets 設一個 "true" 覆蓋過去
# （Dashboard 的值優先於這裡的預設值，兩邊可以並存）。
# ⚠️ 目前為測試期間暫時設為true，Demo或正式展示前必須改回false，否則任何人
# 都能傳暗號關閉別人名下的案件。
ENABLE_DEBUG_RESET = "true"

# Rate limiting bindings（Workers 原生 API，不是 Dashboard 的 WAF 規則）。
# namespace_id 是帳號內用來識別這個計數器的任意正整數字串，不需要事先建立資源。
# 認領端點：同一個 IP 每 60 秒最多 5 次。
[[ratelimits]]
name = "CLAIM_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# LINE webhook：同一個 LINE userId 每 60 秒最多 10 則通報。
[[ratelimits]]
name = "LINE_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 10
  period = 60
